<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Timer</title>
<meta name="description" content="Personal Pomodoro timer with Google Sheets tracking">

<!-- PWA / home screen -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<meta name="theme-color" content="#c0392b">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23c0392b'/%3E%3Ccircle cx='90' cy='100' r='52' fill='none' stroke='rgba(255,255,255,0.25)' stroke-width='6'/%3E%3Cellipse cx='90' cy='38' rx='10' ry='14' fill='%2327ae60' transform='rotate(-15 90 38)'/%3E%3Cline x1='90' y1='76' x2='90' y2='100' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3Cline x1='90' y1='100' x2='110' y2='114' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C%2Fsvg%3E">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='13' fill='%23c0392b'/%3E%3Cellipse cx='16' cy='6' rx='2.5' ry='3.5' fill='%2327ae60' transform='rotate(-15 16 6)'/%3E%3Ccircle cx='16' cy='17' r='7.5' fill='none' stroke='rgba(255,255,255,0.25)' stroke-width='1.5'/%3E%3Cline x1='16' y1='11' x2='16' y2='17' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3Cline x1='16' y1='17' x2='20' y2='20' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C%2Fsvg%3E">

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root {
    --red: #c0392b;
    --red-dark: #96281b;
    --red-light: #e74c3c;
    --green: #27ae60;
    --green-dark: #1e8449;
    --yellow: #f39c12;
    --bg: #faf9f7;
    --bg2: #f0ede8;
    --bg3: #e8e3dc;
    --text: #1a1714;
    --text2: #5c5449;
    --text3: #9c9085;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
    --radius: 12px;
    --timer-size: 220px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #1a1714;
      --bg2: #221f1b;
      --bg3: #2d2925;
      --text: #f5f0ea;
      --text2: #b8b0a4;
      --text3: #7a7068;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --shadow: 0 2px 16px rgba(0,0,0,0.4);
    }
  }

  [data-theme="dark"] {
    --bg: #1a1714;
    --bg2: #221f1b;
    --bg3: #2d2925;
    --text: #f5f0ea;
    --text2: #b8b0a4;
    --text3: #7a7068;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --shadow: 0 2px 16px rgba(0,0,0,0.4);
  }

  [data-theme="light"] {
    --bg: #faf9f7;
    --bg2: #f0ede8;
    --bg3: #e8e3dc;
    --text: #1a1714;
    --text2: #5c5449;
    --text3: #9c9085;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 860px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    font-weight: bold;
    letter-spacing: -0.02em;
    color: var(--red);
  }

  .logo svg { width: 28px; height: 28px; }

  #auth-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #user-info {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    color: var(--text2);
  }

  #user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border2);
  }

  .btn-sign-out {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 4px 12px;
    font-size: 0.8rem;
    color: var(--text2);
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
  }

  .btn-sign-out:hover { background: var(--bg2); }

  main {
    width: 100%;
    max-width: 860px;
    padding: 1.25rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  /* Timer section */
  .timer-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    width: 100%;
  }

  .mode-tabs {
    display: flex;
    gap: 0;
    background: var(--bg2);
    border-radius: 10px;
    padding: 4px;
    border: 1px solid var(--border);
  }

  .mode-tab {
    padding: 8px 20px;
    border-radius: 7px;
    border: none;
    background: none;
    font-size: 0.85rem;
    font-family: inherit;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .mode-tab.active {
    background: var(--red);
    color: white;
    font-weight: bold;
  }

  .timer-ring-container {
    position: relative;
    width: var(--timer-size);
    height: var(--timer-size);
    cursor: pointer;
    user-select: none;
  }

  .timer-svg {
    transform: rotate(-90deg);
    width: 100%;
    height: 100%;
  }

  .timer-track {
    fill: none;
    stroke: var(--bg3);
    stroke-width: 6;
  }

  .timer-progress {
    fill: none;
    stroke: var(--red);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }

  .timer-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .timer-display {
    font-size: 2.8rem;
    font-weight: bold;
    letter-spacing: -0.03em;
    color: var(--text);
    line-height: 1;
    font-family: 'Courier New', monospace;
  }

  .timer-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
  }

  .timer-hint {
    font-size: 0.7rem;
    color: var(--text3);
    margin-top: 4px;
  }

  .timer-controls {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .btn-primary {
    background: var(--red);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 40px;
    font-size: 1rem;
    font-family: 'Georgia', serif;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .btn-primary:hover { background: var(--red-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary.running { background: var(--text2); }
  .btn-primary.running:hover { background: var(--text); }

  .btn-reset {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 0.85rem;
    font-family: inherit;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-reset:hover { background: var(--bg2); }

  /* Session dots */
  .session-dots {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg3);
    border: 1.5px solid var(--border2);
    transition: all 0.3s;
  }

  .dot.filled { background: var(--red); border-color: var(--red); }

  /* Today summary */
  .today-bar {
    width: 100%;
    background: var(--bg2);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 0.875rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }

  .today-stat {
    text-align: center;
    flex: 1;
  }

  .today-stat-value {
    font-size: 1.6rem;
    font-weight: bold;
    color: var(--red);
    font-family: 'Courier New', monospace;
    line-height: 1;
  }

  .today-stat-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text3);
    margin-top: 4px;
  }

  .today-divider {
    width: 1px;
    height: 40px;
    background: var(--border2);
  }

  /* Weekly view */
  .weekly-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    width: 100%;
    margin-bottom: 0.5rem;
  }

  .week-day-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .week-day-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text3);
  }

  .week-bar-wrap {
    width: 100%;
    height: 60px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
  }

  .week-bar {
    width: 70%;
    border-radius: 5px 5px 0 0;
    background: var(--bg3);
    transition: height 0.4s cubic-bezier(0.34,1.56,0.64,1);
    min-height: 3px;
    position: relative;
  }

  .week-bar.has-data { background: var(--red); opacity: 0.75; }
  .week-bar.today { background: var(--red); opacity: 1; }

  .week-bar-val {
    font-size: 0.75rem;
    font-family: 'Courier New', monospace;
    color: var(--text2);
    font-weight: bold;
  }

  .week-day-col.today .week-day-label { color: var(--red); font-weight: bold; }
  .week-day-col.today .week-bar-val { color: var(--red); }

  .weekly-totals {
    display: flex;
    gap: 1.5rem;
    font-size: 0.82rem;
    color: var(--text3);
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
  }

  .weekly-totals strong { color: var(--text); }

  /* Scoreboard */
  .scoreboard {
    width: 100%;
  }

  .scoreboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }

  .scoreboard-title {
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .scoreboard-refresh {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-family: inherit;
    color: var(--text2);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .scoreboard-refresh:hover { background: var(--bg2); }

  .scoreboard-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  .scoreboard-table thead tr {
    border-bottom: 2px solid var(--border2);
  }

  .scoreboard-table th {
    padding: 8px 12px;
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text3);
    font-weight: normal;
  }

  .scoreboard-table th:not(:first-child) { text-align: right; }

  .scoreboard-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
  }

  .scoreboard-table td:not(:first-child) { text-align: right; font-family: 'Courier New', monospace; }

  .scoreboard-table tr.today-row td {
    color: var(--text);
    font-weight: bold;
    background: rgba(192,57,43,0.06);
  }

  .scoreboard-table tr:last-child td { border-bottom: none; }

  .score-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--red);
    color: white;
    font-size: 0.75rem;
    font-weight: bold;
    font-family: 'Courier New', monospace;
  }

  .scoreboard-empty {
    text-align: center;
    padding: 2rem;
    color: var(--text3);
    font-size: 0.9rem;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: var(--text);
    color: var(--bg);
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 0.9rem;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    white-space: nowrap;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--green); color: white; }
  #toast.error { background: var(--red); color: white; }

  /* Theme toggle button */
  .btn-theme {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s;
    line-height: 1;
  }
  .btn-theme:hover { background: var(--bg2); }

  /* Sign-in prompt */
  #signin-prompt {
    text-align: center;
    padding: 1.5rem;
    background: var(--bg2);
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    color: var(--text2);
    font-size: 0.85rem;
    width: 100%;
  }

  #signin-prompt strong { color: var(--text); }

  /* Notification overlay */
  #session-complete-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }

  #session-complete-overlay.show { display: flex; }

  .overlay-card {
    background: var(--bg);
    border-radius: 20px;
    padding: 2.5rem;
    text-align: center;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .overlay-emoji {
    font-size: 3rem;
    margin-bottom: 1rem;
  }

  .overlay-title {
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 0.5rem;
    color: var(--text);
  }

  .overlay-sub {
    font-size: 0.9rem;
    color: var(--text2);
    margin-bottom: 1.5rem;
  }

  .overlay-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-overlay {
    padding: 10px 20px;
    border-radius: 9px;
    border: none;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: bold;
  }

  .btn-overlay.primary { background: var(--red); color: white; }
  .btn-overlay.primary:hover { background: var(--red-dark); }
  .btn-overlay.secondary { background: var(--bg2); color: var(--text); border: 1px solid var(--border2); }
  .btn-overlay.secondary:hover { background: var(--bg3); }

  @media (max-width: 600px) {
    :root { --timer-size: 200px; }

    header { padding: 0.75rem 1rem; }
    .logo { font-size: 1rem; }
    #user-name { display: none; }

    main { padding: 0.75rem 1rem; gap: 1rem; }

    .mode-tabs { width: 100%; justify-content: stretch; }
    .mode-tab { flex: 1; padding: 8px 6px; font-size: 0.78rem; }

    .timer-display { font-size: 2.4rem; }

    .btn-primary { padding: 13px 32px; font-size: 0.95rem; }
    .btn-reset { padding: 13px 16px; }

    .today-bar { padding: 0.75rem 1rem; gap: 0.5rem; }
    .today-stat-value { font-size: 1.4rem; }
    .today-stat-label { font-size: 0.68rem; }
    .today-divider { width: 1px; height: 30px; }

    .weekly-grid { gap: 4px; }
    .week-day-label { font-size: 0.62rem; }
    .week-bar-val { font-size: 0.68rem; }

    .scoreboard-table { font-size: 0.82rem; }
    .scoreboard-table th, .scoreboard-table td { padding: 8px 8px; }

    .overlay-card { padding: 1.75rem 1.25rem; }
    .overlay-title { font-size: 1.25rem; }
  }

  /* Safe area insets for iPhone notch/home bar */
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    body { padding-bottom: env(safe-area-inset-bottom); }
    header { padding-top: calc(0.75rem + env(safe-area-inset-top)); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="17" r="13" fill="#c0392b"/>
      <ellipse cx="16" cy="6" rx="2.5" ry="3.5" fill="#27ae60" transform="rotate(-15 16 6)"/>
      <circle cx="16" cy="17" r="7.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <line x1="16" y1="11" x2="16" y2="17" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16" y1="17" x2="20" y2="20" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    Pomodoro
  </div>
  <div id="auth-area">
    <button class="btn-theme" id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode" aria-label="Toggle theme">
      <span id="theme-icon">☀️</span>
    </button>
    <div id="user-info">
      <img id="user-avatar" src="" alt="Profile">
      <span id="user-name"></span>
      <button class="btn-sign-out" onclick="signOut()">Sign out</button>
    </div>
    <div id="g-signin-btn"></div>
  </div>
</header>

<main>

  <!-- Mode Tabs -->
  <div class="timer-section">
    <div class="mode-tabs">
      <button class="mode-tab active" onclick="setMode('focus')" id="tab-focus">Focus 25min</button>
      <button class="mode-tab" onclick="setMode('short')" id="tab-short">Break 5min</button>
      <button class="mode-tab" onclick="setMode('long')" id="tab-long">Break 10min</button>
    </div>

    <!-- Circular Timer -->
    <div class="timer-ring-container" onclick="toggleTimer()" title="Click to start/pause">
      <svg class="timer-svg" viewBox="0 0 280 280">
        <circle class="timer-track" cx="140" cy="140" r="126"/>
        <circle class="timer-progress" id="timer-arc" cx="140" cy="140" r="126"
          stroke-dasharray="791.7"
          stroke-dashoffset="0"/>
      </svg>
      <div class="timer-inner">
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-label" id="timer-label">Focus</div>
        <div class="timer-hint" id="timer-hint">click to start</div>
      </div>
    </div>

    <div class="timer-controls">
      <button class="btn-primary" id="main-btn" onclick="toggleTimer()">Start</button>
      <button class="btn-reset" onclick="resetTimer()">Reset</button>
    </div>

    <!-- Session dots (4 per pomodoro set) -->
    <div class="session-dots" id="session-dots">
      <div class="dot" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
      <div class="dot" id="dot-3"></div>
      <div class="dot" id="dot-4"></div>
    </div>
  </div>

  <!-- Today Summary -->
  <div class="today-bar">
    <div class="today-stat">
      <div class="today-stat-value" id="today-sessions">0</div>
      <div class="today-stat-label">Sessions Today</div>
    </div>
    <div class="today-divider"></div>
    <div class="today-stat">
      <div class="today-stat-value" id="today-minutes">0</div>
      <div class="today-stat-label">Minutes Focused</div>
    </div>
    <div class="today-divider"></div>
    <div class="today-stat">
      <div class="today-stat-value" id="streak-count">0</div>
      <div class="today-stat-label">Day Streak</div>
    </div>
  </div>

  <!-- Weekly View -->
  <div class="weekly-section" id="weekly-section" style="display:none; width:100%;">
    <div class="scoreboard-header">
      <div class="scoreboard-title" id="weekly-title">This week</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="scoreboard-refresh" id="week-prev" onclick="shiftWeek(-1)">&#8592;</button>
        <button class="scoreboard-refresh" id="week-next" onclick="shiftWeek(1)">&#8594;</button>
      </div>
    </div>
    <div class="weekly-grid" id="weekly-grid"></div>
    <div class="weekly-totals" id="weekly-totals"></div>
  </div>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="scoreboard-header">
      <div class="scoreboard-title">History</div>
      <button class="scoreboard-refresh" onclick="loadScoreboard()">
        &#8635; Refresh
      </button>
    </div>
    <div id="scoreboard-content">
      <div id="signin-prompt">
        <strong>Sign in with Google</strong> to sync your sessions and view your history.
      </div>
    </div>
  </div>

</main>

<!-- Session Complete Overlay -->
<div id="session-complete-overlay">
  <div class="overlay-card">
    <div class="overlay-emoji">&#127813;</div>
    <div class="overlay-title">Session Complete!</div>
    <div class="overlay-sub" id="overlay-sub">Great work. Take a well-deserved break.</div>
    <div class="overlay-actions">
      <button class="btn-overlay secondary" onclick="startBreak(5)">5min break</button>
      <button class="btn-overlay secondary" onclick="startBreak(10)">10min break</button>
      <button class="btn-overlay primary" onclick="closeOverlay()">Keep going</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
// IMPORTANT: Replace this with your actual Google Sheet ID and Client ID
const SHEET_ID = '1_qVAkqRRZwlrRn1y74A0W0EsgTzkvqatIKARtR9E-t4';
const GOOGLE_CLIENT_ID = '839660100851-4kgvbtq781bhol3i5khl8mq9nuk4bc26.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

// ─── STATE ────────────────────────────────────────────────────────────────────
let mode = 'focus';
let totalSeconds = 25 * 60;
let remaining = totalSeconds;
let running = false;
let interval = null;
let accessToken = null;
let userProfile = null;
let todaySessions = 0;
let todayMinutes = 0;
let setCount = 0; // dots in current set of 4

const MODES = {
  focus: { label: 'Focus', seconds: 25 * 60, color: '#c0392b' },
  short: { label: 'Short Break', seconds: 5 * 60, color: '#27ae60' },
  long:  { label: 'Long Break',  seconds: 10 * 60, color: '#2980b9' },
};

const CIRCUMFERENCE = 2 * Math.PI * 126; // 791.7

// ─── TIMER ────────────────────────────────────────────────────────────────────
function setMode(m) {
  if (running) { resetTimer(); }
  mode = m;
  totalSeconds = MODES[m].seconds;
  remaining = totalSeconds;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + m).classList.add('active');
  document.getElementById('timer-arc').style.stroke = MODES[m].color;
  document.getElementById('timer-label').textContent = MODES[m].label;
  updateDisplay();
}

function toggleTimer() {
  if (running) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (remaining <= 0) { resetTimer(); return; }
  running = true;
  document.getElementById('main-btn').textContent = 'Pause';
  document.getElementById('main-btn').classList.add('running');
  document.getElementById('timer-hint').textContent = 'click to pause';
  interval = setInterval(tick, 1000);
}

function pauseTimer() {
  running = false;
  clearInterval(interval);
  document.getElementById('main-btn').textContent = 'Resume';
  document.getElementById('main-btn').classList.remove('running');
  document.getElementById('timer-hint').textContent = 'click to resume';
}

function resetTimer() {
  running = false;
  clearInterval(interval);
  remaining = MODES[mode].seconds;
  document.getElementById('main-btn').textContent = 'Start';
  document.getElementById('main-btn').classList.remove('running');
  document.getElementById('timer-hint').textContent = 'click to start';
  updateDisplay();
}

function tick() {
  remaining--;
  updateDisplay();
  if (remaining <= 0) {
    clearInterval(interval);
    running = false;
    if (mode === 'focus') {
      onFocusComplete();
    } else {
      onBreakComplete();
    }
  }
}

function updateDisplay() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  document.getElementById('timer-display').textContent =
    String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  const pct = remaining / totalSeconds;
  const offset = CIRCUMFERENCE * (1 - pct);
  document.getElementById('timer-arc').style.strokeDashoffset = offset;
}

// ─── AUDIO ───────────────────────────────────────────────────────────────────
function playChime(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    if (type === 'focus') {
      // Three rising tones — satisfying completion sound
      const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = ctx.currentTime + i * 0.18;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.35, start + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.6);
        osc.start(start);
        osc.stop(start + 0.6);
      });
    } else {
      // Two soft descending tones — gentle break-end nudge
      const notes = [659.25, 523.25]; // E5, C5
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = ctx.currentTime + i * 0.22;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
        osc.start(start);
        osc.stop(start + 0.5);
      });
    }
  } catch(e) {}
}

function onFocusComplete() {
  todaySessions++;
  todayMinutes += 25;
  setCount = (setCount % 4) + 1;

  // Update dots
  for (let i = 1; i <= 4; i++) {
    document.getElementById('dot-' + i).classList.toggle('filled', i <= setCount);
  }

  updateTodayDisplay();

  // Save to localStorage + Google Sheets
  saveLocal();
  renderWeek();
  if (accessToken) { syncToSheets(); }

  // Notify
  if (Notification.permission === 'granted') {
    new Notification('Pomodoro complete!', {
      body: 'Session ' + todaySessions + ' done. Take a break.',
      icon: 'data:image/svg+xml,...'
    });
  }

  // Show overlay
  document.getElementById('overlay-sub').textContent =
    'Session ' + todaySessions + ' complete. ' + (25 * todaySessions) + ' minutes focused today.';
  document.getElementById('session-complete-overlay').classList.add('show');
  playChime('focus');

  // Request notification permission
  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function onBreakComplete() {
  playChime('break');
  showToast('Break over! Ready to focus?', 'success');
  resetTimer();
  setMode('focus');
}

function closeOverlay() {
  document.getElementById('session-complete-overlay').classList.remove('show');
  resetTimer();
}

function startBreak(minutes) {
  document.getElementById('session-complete-overlay').classList.remove('show');
  setMode(minutes === 5 ? 'short' : 'long');
  startTimer();
}

function updateTodayDisplay() {
  document.getElementById('today-sessions').textContent = todaySessions;
  document.getElementById('today-minutes').textContent = todayMinutes;
}

// ─── LOCAL STORAGE ────────────────────────────────────────────────────────────
function getTodayKey() {
  return 'pomo_' + new Date().toISOString().slice(0, 10);
}

function saveLocal() {
  const key = getTodayKey();
  const data = { sessions: todaySessions, minutes: todayMinutes };
  localStorage.setItem(key, JSON.stringify(data));
}

function loadLocal() {
  const key = getTodayKey();
  const raw = localStorage.getItem(key);
  if (raw) {
    const data = JSON.parse(raw);
    todaySessions = data.sessions || 0;
    todayMinutes = data.minutes || 0;
    updateTodayDisplay();
    // Restore dots
    const dotPos = todaySessions % 4 || (todaySessions > 0 ? 4 : 0);
    setCount = dotPos;
    for (let i = 1; i <= 4; i++) {
      document.getElementById('dot-' + i).classList.toggle('filled', i <= setCount);
    }
  }
}

function calcStreak() {
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const k = 'pomo_' + d.toISOString().slice(0, 10);
    const raw = localStorage.getItem(k);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.sessions > 0) { streak++; } else { break; }
    } else { break; }
  }
  document.getElementById('streak-count').textContent = streak;
}

// ─── GOOGLE AUTH ──────────────────────────────────────────────────────────────
function initGoogleAuth() {
  if (typeof google === 'undefined') {
    setTimeout(initGoogleAuth, 500);
    return;
  }

  const client = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) { showToast('Sign-in failed: ' + resp.error, 'error'); return; }
      accessToken = resp.access_token;
      fetchUserProfile();
    },
  });

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: (resp) => {
      // Decode JWT to get profile
      const payload = JSON.parse(atob(resp.credential.split('.')[1]));
      userProfile = payload;
      showUserInfo(payload);
      // Now get OAuth token for Sheets
      client.requestAccessToken({ prompt: '' });
    },
  });

  google.accounts.id.renderButton(
    document.getElementById('g-signin-btn'),
    { theme: 'outline', size: 'medium', text: 'sign_in_with', shape: 'rectangular' }
  );
}

function fetchUserProfile() {
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
    headers: { Authorization: 'Bearer ' + accessToken }
  })
  .then(r => r.json())
  .then(p => {
    userProfile = p;
    showUserInfo(p);
    loadScoreboard();
    syncToSheets();
  })
  .catch(() => {});
}

function showUserInfo(profile) {
  document.getElementById('user-avatar').src = profile.picture || '';
  document.getElementById('user-name').textContent = profile.given_name || profile.name || '';
  document.getElementById('user-info').style.display = 'flex';
  document.getElementById('g-signin-btn').style.display = 'none';
}

function signOut() {
  accessToken = null;
  userProfile = null;
  document.getElementById('user-info').style.display = 'none';
  document.getElementById('g-signin-btn').style.display = 'block';
  document.getElementById('scoreboard-content').innerHTML =
    '<div id="signin-prompt"><strong>Sign in with Google</strong> to sync your sessions and view your history.</div>';
  if (typeof google !== 'undefined') {
    google.accounts.id.disableAutoSelect();
  }
}

// ─── GOOGLE SHEETS ────────────────────────────────────────────────────────────
function formatDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate() + ' ' + d.getFullYear();
}

async function syncToSheets() {
  if (!accessToken) return;

  const today = new Date();
  const dateStr = formatDate(today);

  try {
    // First read the sheet to find today's row
    const readResp = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Sheet1!A:C`,
      { headers: { Authorization: 'Bearer ' + accessToken } }
    );
    const readData = await readResp.json();
    const rows = readData.values || [];

    // Find today's row (header is row 0, data starts row 1)
    let rowIndex = -1;
    for (let i = 1; i < rows.length; i++) {
      if (rows[i][0] === dateStr) { rowIndex = i + 1; break; } // +1 for 1-indexed
    }

    if (rowIndex === -1) {
      // Append a new row
      await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Sheet1!A:C:append?valueInputOption=USER_ENTERED`,
        {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + accessToken,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ values: [[dateStr, todaySessions, todayMinutes]] }),
        }
      );
    } else {
      // Update existing row
      await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Sheet1!A${rowIndex}:C${rowIndex}?valueInputOption=USER_ENTERED`,
        {
          method: 'PUT',
          headers: {
            Authorization: 'Bearer ' + accessToken,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ values: [[dateStr, todaySessions, todayMinutes]] }),
        }
      );
    }

    showToast('Synced to Google Sheets', 'success');
    loadScoreboard();
  } catch (e) {
    showToast('Sync failed - saved locally', 'error');
  }
}

let allSheetRows = []; // cached sheet data
let weekOffset = 0;   // 0 = current week, -1 = last week, etc.

// Returns the Monday of the week containing `date`
function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0=Sun,1=Mon,...6=Sat
  const diff = (day === 0) ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function shiftWeek(delta) {
  weekOffset += delta;
  if (weekOffset > 0) weekOffset = 0; // can't go into future
  renderWeek();
}

function renderWeek() {
  const weekSection = document.getElementById('weekly-section');
  const grid = document.getElementById('weekly-grid');
  const totalsEl = document.getElementById('weekly-totals');
  const titleEl = document.getElementById('weekly-title');
  const nextBtn = document.getElementById('week-next');

  if (!allSheetRows.length && weekOffset === 0) {
    // No sheet data yet — try local storage
  }

  // Build a lookup map from formatted date string -> {sessions, minutes}
  const lookup = {};
  for (const r of allSheetRows) {
    if (r[0]) lookup[r[0]] = { sessions: parseInt(r[1]) || 0, minutes: parseInt(r[2]) || 0 };
  }

  const today = new Date();
  today.setHours(0,0,0,0);

  // Base monday = monday of current week + offset
  const baseMonday = getMondayOf(today);
  baseMonday.setDate(baseMonday.getDate() + weekOffset * 7);

  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const todayStr = formatDate(today);

  // Title
  const endOfWeek = new Date(baseMonday);
  endOfWeek.setDate(endOfWeek.getDate() + 6);
  if (weekOffset === 0) {
    titleEl.textContent = 'This week';
  } else {
    titleEl.textContent = formatDate(baseMonday) + ' – ' + formatDate(endOfWeek);
  }

  // Disable next button if on current week
  nextBtn.disabled = weekOffset === 0;
  nextBtn.style.opacity = weekOffset === 0 ? '0.3' : '1';

  // Build days data
  let weekSessions = 0, weekMinutes = 0;
  const dayData = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(baseMonday);
    d.setDate(d.getDate() + i);
    const dStr = formatDate(d);
    const entry = lookup[dStr] || { sessions: 0, minutes: 0 };
    // For today use live local data if sheet hasn't synced yet
    if (dStr === todayStr && todaySessions > (entry.sessions || 0)) {
      entry.sessions = todaySessions;
      entry.minutes = todayMinutes;
    }
    dayData.push({ label: days[i], dateStr: dStr, isToday: dStr === todayStr, isFuture: d > today, ...entry });
    weekSessions += entry.sessions;
    weekMinutes += entry.minutes;
  }

  // Max sessions for bar scaling
  const maxSessions = Math.max(1, ...dayData.map(d => d.sessions));

  let gridHtml = '';
  for (const d of dayData) {
    const heightPct = d.isFuture ? 0 : Math.max(3, Math.round((d.sessions / maxSessions) * 60));
    const barClass = d.isFuture ? '' : (d.isToday ? 'today' : (d.sessions > 0 ? 'has-data' : ''));
    gridHtml += `<div class="week-day-col${d.isToday ? ' today' : ''}">
      <div class="week-bar-val">${d.sessions > 0 ? d.sessions : ''}</div>
      <div class="week-bar-wrap">
        <div class="week-bar ${barClass}" style="height:${heightPct}px;" title="${d.dateStr}: ${d.sessions} sessions, ${d.minutes}min"></div>
      </div>
      <div class="week-day-label">${d.label}</div>
    </div>`;
  }
  grid.innerHTML = gridHtml;

  totalsEl.innerHTML = `
    <span>Week total: <strong>${weekSessions} sessions</strong></span>
    <span><strong>${weekMinutes} min</strong> focused</span>
    <span>${weekMinutes >= 60 ? '<strong>' + (Math.round(weekMinutes / 60 * 10) / 10) + 'hrs</strong>' : ''}</span>
  `;

  weekSection.style.display = 'block';
}

async function loadScoreboard() {
  if (!accessToken) {
    // Still render weekly from localStorage
    renderWeek();
    return;
  }

  const container = document.getElementById('scoreboard-content');
  container.innerHTML = '<div class="scoreboard-empty">Loading...</div>';

  try {
    const resp = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Sheet1!A:C`,
      { headers: { Authorization: 'Bearer ' + accessToken } }
    );
    const data = await resp.json();
    allSheetRows = (data.values || []).slice(1).filter(r => r[0] && (r[1] || r[2]));

    // Render weekly chart
    renderWeek();

    if (allSheetRows.length === 0) {
      container.innerHTML = '<div class="scoreboard-empty">No sessions recorded yet. Start your first Pomodoro!</div>';
      return;
    }

    const today = formatDate(new Date());
    const display = allSheetRows.slice(-14).reverse();

    let html = '<table class="scoreboard-table"><thead><tr>' +
      '<th>Date</th><th>Sessions</th><th>Minutes</th>' +
      '</tr></thead><tbody>';

    for (const row of display) {
      const isToday = row[0] === today;
      const sessions = parseInt(row[1]) || 0;
      const minutes = parseInt(row[2]) || 0;
      html += `<tr class="${isToday ? 'today-row' : ''}">
        <td>${row[0]}${isToday ? ' <small style="color:var(--red)">today</small>' : ''}</td>
        <td>${sessions > 0 ? '<span class="score-badge">' + sessions + '</span>' : '-'}</td>
        <td>${minutes > 0 ? minutes + 'min' : '-'}</td>
      </tr>`;
    }

    html += '</tbody></table>';

    const totalS = allSheetRows.reduce((a, r) => a + (parseInt(r[1]) || 0), 0);
    const totalM = allSheetRows.reduce((a, r) => a + (parseInt(r[2]) || 0), 0);
    html += `<div style="margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border); display:flex; gap:1.5rem; font-size:0.8rem; color:var(--text3);">
      <span>All time: <strong style="color:var(--text)">${totalS} sessions</strong></span>
      <span><strong style="color:var(--text)">${Math.round(totalM / 60 * 10) / 10}hrs</strong> focused</span>
    </div>`;

    container.innerHTML = html;
    calcStreak();
  } catch (e) {
    container.innerHTML = '<div class="scoreboard-empty">Could not load history. Try refreshing.</div>';
  }
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || '');
  clearTimeout(t._to);
  t._to = setTimeout(() => { t.className = ''; }, 3000);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
// ─── THEME ───────────────────────────────────────────────────────────────────
function getSystemTheme() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('pomo_theme', theme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || getSystemTheme();
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

// Load saved theme or follow system
const savedTheme = localStorage.getItem('pomo_theme');
if (savedTheme) {
  applyTheme(savedTheme);
} else {
  applyTheme(getSystemTheme());
}

loadLocal();
calcStreak();
updateDisplay();
renderWeek(); // show from localStorage even before sign-in
initGoogleAuth();

// Restore from localStorage if tab was closed mid-session
const savedMode = localStorage.getItem('pomo_current_mode');
const savedRemaining = localStorage.getItem('pomo_remaining');
const savedPaused = localStorage.getItem('pomo_paused_at');

if (savedMode && savedRemaining && savedPaused) {
  const elapsed = Math.floor((Date.now() - parseInt(savedPaused)) / 1000);
  const newRemaining = Math.max(0, parseInt(savedRemaining) - elapsed);
  if (newRemaining > 0 && savedMode === 'focus') {
    mode = savedMode;
    totalSeconds = MODES[mode].seconds;
    remaining = newRemaining;
    document.getElementById('tab-' + mode).classList.add('active');
    document.getElementById('timer-label').textContent = MODES[mode].label;
    document.getElementById('timer-hint').textContent = 'click to resume';
    updateDisplay();
  }
  localStorage.removeItem('pomo_current_mode');
  localStorage.removeItem('pomo_remaining');
  localStorage.removeItem('pomo_paused_at');
}

// Save state before unload
window.addEventListener('beforeunload', () => {
  if (running || remaining < MODES[mode].seconds) {
    localStorage.setItem('pomo_current_mode', mode);
    localStorage.setItem('pomo_remaining', remaining);
    localStorage.setItem('pomo_paused_at', Date.now());
  }
});

// Page visibility — pause/resume
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) {
    // Keep running — just note the time
    localStorage.setItem('pomo_bg_at', Date.now());
  }
});
</script>
